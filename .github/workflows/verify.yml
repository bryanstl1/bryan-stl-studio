name: Verify prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python src/render_v03.py
      - name: Verify output
        run: |
          python - <<'PY'
          import json, subprocess
          p='output/prototype-v03.mp4'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,width,height,r_frame_rate','-of','json',p]))
          v=next(s for s in info['streams'] if s['codec_name']=='h264')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'30/1'),info
          assert abs(float(info['format']['duration'])-8)<.05,info
          assert any(s['codec_name']=='aac' for s in info['streams']),info
          print('PASS: 8 s, 1080x1920, 30fps, H.264/AAC')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bryan-stl-prototype-v03
          path: |
            output/prototype-v03.mp4
            output/contact-sheet-v03.jpg
          retention-days: 14
